# Base theme matches the FundaCheck design system (light is the primary theme).
# Streamlit bakes these into widget internals, so they must agree with the
# stylesheet or controls come out the wrong colour; the dark-mode overrides live
# in assets/style.css.
[theme]
base = "light"
primaryColor = "#177245"
backgroundColor = "#ececeb"
secondaryBackgroundColor = "#ffffff"
textColor = "#15201a"
font = "sans serif"

[server]
maxUploadSize = 25

[browser]
gatherUsageStats = false
